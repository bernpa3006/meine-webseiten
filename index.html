<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meine Webseiten</title>
<meta name="description" content="Übersicht aller veröffentlichten Webseiten.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script>
  tailwind.config = { theme: { extend: { fontFamily: { sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'] } } } }
</script>
</head>
<body class="bg-slate-50 font-sans text-slate-900 antialiased">
  <header class="mx-auto max-w-5xl px-5 pb-6 pt-14">
    <p class="text-sm font-bold uppercase tracking-widest text-indigo-600">Projekt-Hub</p>
    <h1 class="mt-3 text-4xl font-extrabold tracking-tight sm:text-5xl">Meine Webseiten</h1>
    <p class="mt-3 max-w-xl text-lg text-slate-600">Alle veröffentlichten Seiten auf einen Blick. Jede Karte führt direkt zur Live-Version.</p>
  </header>

  <main class="mx-auto max-w-5xl px-5 pb-20">
    <div class="grid gap-5 sm:grid-cols-2 lg:grid-cols-3">
      <a href="https://meine-webseiten-psi.vercel.app/bayern-fanclub-bern/" class="group flex flex-col rounded-2xl border border-slate-200 bg-white p-6 shadow-sm transition hover:-translate-y-1 hover:shadow-xl">
        <div class="flex h-24 items-center justify-center rounded-xl" style="background:linear-gradient(135deg,#DC052D,#0066B2)">
          <svg width="44" height="44" viewBox="0 0 34 34" aria-hidden="true"><path d="M17 1L33 17L17 33L1 17Z" fill="#fff" fill-opacity=".95"/><path d="M17 8L26 17L17 26L8 17Z" fill="#DC052D"/><path d="M17 12.5L21.5 17L17 21.5L12.5 17Z" fill="#0066B2"/></svg>
        </div>
        <h2 class="mt-5 text-lg font-extrabold tracking-tight">Bayern München Fanclub Bern</h2>
        <p class="mt-1.5 flex-1 text-sm leading-relaxed text-slate-600">Fanseite mit Public Viewings, Stammtisch, Mitgliedschaft und Kontaktformular. Testseite.</p>
        <span class="mt-4 inline-flex items-center gap-1.5 text-sm font-bold text-indigo-600">Seite öffnen <i data-lucide="arrow-up-right" class="h-4 w-4 transition group-hover:translate-x-0.5 group-hover:-translate-y-0.5"></i></span>
        <span class="mt-1 text-xs text-slate-400">/bayern-fanclub-bern/</span>
      </a>
    </div>
  </main>
  <script>lucide.createIcons();</script>
</body>
</html>
