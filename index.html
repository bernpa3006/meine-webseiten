<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meine Webseiten</title>
<meta name="description" content="Übersicht aller veröffentlichten Webseiten.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script>
  tailwind.config = { theme: { extend: { fontFamily: { sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'] } } } }
</script>
</head>
<body class="bg-slate-50 font-sans text-slate-900 antialiased">
  <header class="mx-auto max-w-5xl px-5 pb-6 pt-14">
    <p class="text-sm font-bold uppercase tracking-widest text-indigo-600">Projekt-Hub</p>
    <h1 class="mt-3 text-4xl font-extrabold tracking-tight sm:text-5xl">Meine Webseiten</h1>
    <p class="mt-3 max-w-xl text-lg text-slate-600">Alle veröffentlichten Seiten auf einen Blick. Jede Karte führt direkt zur Live-Version.</p>
  </header>

  <main class="mx-auto max-w-5xl px-5 pb-20">
    <div class="rounded-2xl border border-dashed border-slate-300 bg-white p-10 text-center text-slate-500">
        <p class="font-semibold text-slate-700">Noch keine Seiten veröffentlicht.</p>
        <p class="mt-1 text-sm">Neue Projekte erscheinen hier automatisch als Karte.</p>
      </div>
  </main>
  <script>lucide.createIcons();</script>
</body>
</html>
